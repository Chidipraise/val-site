<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine 💙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000, #0f4c81);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating hearts animation */
        .heart {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.2);
            animation: float 6s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background-color: #0b1c2d;
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(77, 168, 218, 0.2);
        }

        h1 {
            color: #4da8da;
            font-size: 2.8rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .message {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin: 0 5px;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .question {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 30px 0;
            color: #ffffff;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 40px;
            position: relative;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #yesBtn {
            background-color: #4da8da;
            color: #0b1c2d;
        }

        #yesBtn:hover {
            background-color: #3d8cc9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(77, 168, 218, 0.4);
        }

        #yesBtn:active {
            transform: translateY(1px);
        }

        #noBtn {
            background-color: #222;
            color: white;
            position: absolute;
            transition: all 0.1s ease;
        }

        .countdown {
            margin-top: 25px;
            padding: 15px;
            background-color: rgba(77, 168, 218, 0.1);
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #a8dadc;
            border: 1px solid rgba(168, 218, 220, 0.2);
        }

        .countdown span {
            color: #4da8da;
        }

        /* Responsive design */
        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .message {
                font-size: 1.2rem;
            }
            
            .question {
                font-size: 1.5rem;
            }
            
            button {
                padding: 14px 24px;
                min-width: 120px;
                font-size: 1.1rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            #noBtn {
                position: relative;
            }
        }

        /* Acceptance page styles */
        .acceptance-page {
            background: linear-gradient(135deg, #000000, #0f4c81);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .acceptance-card {
            background-color: #0b1c2d;
            border-radius: 25px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(77, 168, 218, 0.2);
        }

        .acceptance-card h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #ff4d6d;
        }

        .acceptance-message {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .signature {
            font-size: 1.8rem;
            color: #4da8da;
            margin-top: 40px;
            font-style: italic;
        }

        .back-button {
            margin-top: 30px;
            background-color: #4da8da;
            color: #0b1c2d;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background-color: #3d8cc9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(77, 168, 218, 0.4);
        }
    </style>
</head>
<body>
    <!-- Main Proposal Card -->
    <div class="card" id="proposalCard">
        <h1>My Treasure 💙</h1>
        
        <div class="message">
            <p>My heart, my babe <span class="heart-icon">❤️</span></p>
            <p>You are my safe place <span class="heart-icon">🫶</span></p>
        </div>
        
        <div class="question">
            <p>Will you be my Valentine? <span class="heart-icon">💙</span></p>
        </div>
        
        <div class="buttons">
            <button id="yesBtn">Forever ❤️</button>
            <button id="noBtn">No 😏</button>
        </div>
        
        <div class="countdown" id="countdown">
            💙 Countdown to Valentine's Day: <span id="countdownText">Calculating...</span> 💙
        </div>
    </div>

    <!-- Floating hearts will be generated by JavaScript -->
    
    <script>
        // Create floating hearts
        function createHearts() {
            const heartsContainer = document.body;
            const heartCount = 15;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                
                // Random position
                heart.style.left = Math.random() * 100 + 'vw';
                
                // Random size
                const size = Math.random() * 30 + 15;
                heart.style.fontSize = size + 'px';
                
                // Random animation delay and duration
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                
                heartsContainer.appendChild(heart);
            }
        }
        
        // Initialize hearts
        createHearts();
        
        // Yes button functionality
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposalCard = document.getElementById('proposalCard');
        
        yesBtn.addEventListener('click', function() {
            // Create confetti effect
            createConfetti();
            
            // Show acceptance page after a short delay
            setTimeout(function() {
                document.body.innerHTML = `
                    <div class="acceptance-page">
                        <div class="acceptance-card">
                            <h1>💙 You Said Yes! ❤️</h1>
                            <div class="acceptance-message">
                                <p>My love, hearing you say <strong>"YES"</strong> fills my heart with indescribable joy! 🦋💙</p>
                                <p>There's no one else I'd rather spend this Valentine's Day with, or every day after.</p>
                                <p>I promise to make you feel like the incredible person you are, today and always. 👑</p>
                                <p>Get ready for the most special Valentine's Day ever! 🌹</p>
                            </div>
                            <div class="signature">
                                Forever yours,<br>Your Baby 💍💙
                            </div>
                            <button class="back-button" onclick="location.reload()">Create Another Proposal</button>
                        </div>
                    </div>
                `;
            }, 800);
        });
        
        // No button functionality - moves randomly
        noBtn.addEventListener('mouseover', function() {
            // Get button and container dimensions
            const button = this;
            const container = button.parentElement;
            const containerRect = container.getBoundingClientRect();
            const buttonRect = button.getBoundingClientRect();
            
            // Calculate maximum movement within container
            const maxX = containerRect.width - buttonRect.width - 20;
            const maxY = containerRect.height - buttonRect.height - 20;
            
            // Generate random position within container
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // Apply new position
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
            
            // Add a funny message that changes occasionally
            const messages = [
                "Try again! 😏",
                "Not so fast! 😉",
                "You can't catch me! 😄",
                "Choose YES instead! 💙",
                "I'm slippery! 🐠",
                "Over here! 👈"
            ];
            
            // Change text occasionally (1 in 3 chance)
            if (Math.random() < 0.33) {
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                button.textContent = randomMsg;
                
                // Revert to original after a moment
                setTimeout(() => {
                    button.textContent = "No 😏";
                }, 800);
            }
        });
        
        // Countdown to Valentine's Day
        function updateCountdown() {
            const now = new Date();
            let valentinesYear = now.getFullYear();
            
            // If Valentine's Day has passed this year, target next year
            const valentinesDate = new Date(valentinesYear, 1, 14); // February is month 1 (0-indexed)
            if (now > valentinesDate) {
                valentinesYear++;
            }
            
            const targetDate = new Date(valentinesYear, 1, 14);
            const timeDiff = targetDate - now;
            
            // Calculate days, hours, minutes
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
            
            // Display countdown
            const countdownText = document.getElementById('countdownText');
            
            if (timeDiff < 0) {
                // It's Valentine's Day!
                countdownText.innerHTML = `Happy Valentine's Day! 💖`;
            } else {
                countdownText.innerHTML = `${days} days, ${hours} hours, ${minutes} minutes`;
            }
        }
        
        // Update countdown every second
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call
        
        // Confetti effect function
        function createConfetti() {
            const colors = ['#ff4d6d', '#4da8da', '#a8dadc', '#ffb4c4', '#ffcc00'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('heart');
                confetti.innerHTML = ['❤️', '💙', '💖', '💝', '🎉'][Math.floor(Math.random() * 5)];
                confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.zIndex = '1000';
                
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
