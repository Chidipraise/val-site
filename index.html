<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine, Bestie! 💃🏽💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            font-size: 24px;
            opacity: 0.7;
            animation: float 6s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(106, 137, 204, 0.2);
            position: relative;
            z-index: 1;
            border: 2px solid rgba(106, 137, 204, 0.1);
        }

        @keyframes floatTitle {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            color: #6a89cc;
            margin-bottom: 20px;
            font-size: 2.5rem;
            animation: floatTitle 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .message {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 20px 0;
            color: #333;
        }

        .emoji {
            font-size: 1.8rem;
            margin: 0 5px;
        }

        .question {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 30px 0;
            color: #6a89cc;
            padding: 15px;
            background: linear-gradient(to right, #f8f9ff, #ffffff);
            border-radius: 20px;
            border: 2px dashed #a1c4fd;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        #yesBtn {
            background: linear-gradient(135deg, #6a89cc, #8a9ed4);
            color: white;
        }

        #yesBtn:hover {
            background: linear-gradient(135deg, #5a79bc, #7a8ec4);
            box-shadow: 0 8px 20px rgba(106, 137, 204, 0.3);
        }

        #noBtn {
            background: linear-gradient(135deg, #ddd, #eee);
            color: #666;
            position: relative;
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #ccc, #ddd);
        }

        .countdown {
            margin-top: 25px;
            padding: 15px;
            background: linear-gradient(to right, #f0f5ff, #ffffff);
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #6a89cc;
            border: 2px solid #e3ebff;
        }

        .countdown span {
            color: #ff6b8b;
            font-size: 1.3rem;
        }

        /* Mobile responsive */
        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .message {
                font-size: 1.1rem;
            }
            
            .question {
                font-size: 1.5rem;
                padding: 12px;
            }
            
            button {
                padding: 12px 20px;
                min-width: 140px;
                font-size: 1.1rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            #noBtn {
                position: relative !important;
                left: 0 !important;
                top: 0 !important;
                transform: none !important;
            }
        }

        /* Acceptance page styles */
        .acceptance-page {
            background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .acceptance-card {
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(106, 137, 204, 0.3);
            border: 2px solid rgba(106, 137, 204, 0.1);
        }

        .acceptance-card h1 {
            color: #ff6b8b;
            font-size: 2.8rem;
            margin-bottom: 25px;
            animation: floatTitle 3s ease-in-out infinite;
        }

        .photo-frame {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px;
            margin: 20px 0;
            border: 5px solid #6a89cc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .acceptance-message {
            font-size: 1.4rem;
            line-height: 1.7;
            margin: 25px 0;
            color: #333;
            padding: 0 10px;
        }

        .signature {
            font-size: 1.6rem;
            color: #6a89cc;
            margin-top: 30px;
            font-style: italic;
            font-weight: 600;
        }

        .back-button {
            margin-top: 25px;
            background: linear-gradient(135deg, #6a89cc, #8a9ed4);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(106, 137, 204, 0.3);
        }
    </style>
</head>
<body>
    <!-- Main Proposal Card -->
    <div class="card" id="proposalCard">
        <h1>Beatrice 😄❤️</h1>
        
        <div class="message">
            <p>Bestieee <span class="emoji">💕</span></p>
            <p>Valentine is coming oo <span class="emoji">😌</span></p>
        </div>
        
        <div class="question">
            <p>Be my Valentine? <span class="emoji">❤️</span></p>
        </div>
        
        <div class="buttons">
            <button id="yesBtn">Yes bestie 💃🏽</button>
            <button id="noBtn">No 😜</button>
        </div>
        
        <div class="countdown" id="countdown">
            ⏰ <span id="countdownText">Counting down to Valentine's Day...</span> 💕
        </div>
    </div>

    <!-- Floating hearts will be generated here -->
    
    <script>
        // Create floating hearts
        function createHearts() {
            const hearts = ['🌸', '💕', '❤️', '💖', '💝', '✨', '🥂'];
            const colors = ['#ff6b8b', '#6a89cc', '#ffcc00', '#a1c4fd', '#ff9eb5'];
            
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                
                document.body.appendChild(heart);
            }
        }
        
        // Initialize hearts
        createHearts();
        
        // Yes button functionality
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        
        yesBtn.addEventListener('click', function() {
            // Create celebration effect
            createConfetti();
            
            // Show acceptance page after delay
            setTimeout(function() {
                document.body.innerHTML = `
                    <div class="acceptance-page">
                        <div class="acceptance-card">
                            <h1>🥂 BESTIE VALENTINE ❤️🥂</h1>
                            
                            <!-- Replace with your photo URL or local path -->
                            <img src="https://images.unsplash.com/photo-1518568814500-bf0f8d125f46?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                                 alt="Bestie celebration" 
                                 class="photo-frame">
                            
                            <div class="acceptance-message">
                                <p>Let's gooo! 🥂❤️</p>
                                <p><strong>Valentines come and go, but Besties are forever</strong> 👊✨</p>
                                <p>I'm so glad we're doing this—no stress, just good vibes and way too much chocolate 🍫😄</p>
                                <p>Thanks for being the best "Val" a person could ask for ❤️🫶</p>
                            </div>
                            
                            <div class="signature">
                                Kosi (aka your bestie) 💙
                            </div>
                            
                            <button class="back-button" onclick="location.reload()">Make Another Card</button>
                        </div>
                    </div>
                `;
                
                // Add floating hearts to acceptance page too
                setTimeout(createHearts, 100);
            }, 800);
        });
        
        // No button functionality - more challenging!
        let escapeCount = 0;
        noBtn.addEventListener('mouseover', function() {
            escapeCount++;
            const button = this;
            
            // Make it escape to random position
            const maxX = window.innerWidth - button.offsetWidth - 50;
            const maxY = window.innerHeight - button.offsetHeight - 50;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            button.style.position = 'fixed';
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
            button.style.transition = 'left 0.2s ease, top 0.2s ease';
            
            // Funny messages that change
            const messages = [
                "Try again! 😜",
                "Too slow! 🐢",
                "Can't catch me! 🐒",
                "Over here! 👈",
                "Nope! 🙅‍♀️",
                "Nice try bestie! 💕",
                "Click YES instead! 😄",
                "I'm slippery! 🐠",
                "Not today! 📅",
                "You're getting warmer! 🔥"
            ];
            
            // Change message
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            button.textContent = randomMsg;
            
            // Make button slightly bigger for fun
            button.style.transform = 'scale(1.1)';
            
            // Revert after a moment
            setTimeout(() => {
                button.textContent = "No 😜";
                button.style.transform = 'scale(1)';
            }, 600);
            
            // Make it harder after 5 escapes
            if (escapeCount > 5) {
                button.style.fontSize = '0.9rem';
                button.style.padding = '10px 20px';
            }
        });
        
        // Countdown to Valentine's Day
        function updateCountdown() {
            const now = new Date();
            let valentinesYear = now.getFullYear();
            
            // If Valentine's Day has passed this year, target next year
            const valentinesDate = new Date(valentinesYear, 1, 14);
            if (now > valentinesDate) {
                valentinesYear++;
            }
            
            const targetDate = new Date(valentinesYear, 1, 14);
            const timeDiff = targetDate - now;
            
            // Calculate time
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            
            // Display countdown
            const countdownText = document.getElementById('countdownText');
            
            if (timeDiff < 0) {
                countdownText.innerHTML = `Happy Valentine's Day, bestie! 💖`;
            } else if (days === 0) {
                countdownText.innerHTML = `${hours}h ${minutes}m to go! 🎉`;
            } else {
                countdownText.innerHTML = `${days} days, ${hours}h ${minutes}m to go!`;
            }
        }
        
        // Update countdown every minute
        setInterval(updateCountdown, 60000);
        updateCountdown(); // Initial call
        
        // Confetti effect
        function createConfetti() {
            const confettiItems = ['🌸', '💕', '❤️', '✨', '🎉', '🥂', '💖', '💝'];
            const colors = ['#ff6b8b', '#6a89cc', '#ffcc00', '#a1c4fd', '#4cd964', '#ff9eb5'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('floating-heart');
                confetti.innerHTML = confettiItems[Math.floor(Math.random() * confettiItems.length)];
                confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.fontSize = (Math.random() * 25 + 15) + 'px';
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.zIndex = '1000';
                confetti.style.opacity = '1';
                
                document.body.appendChild(confetti);
                
                // Remove after animation
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
        
        // Add audio control (optional)
        const audio = document.createElement('audio');
        audio.autoplay = true;
        audio.loop = true;
        audio.volume = 0.3;
        audio.innerHTML = `
            <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-sunset-687.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        `;
        document.body.appendChild(audio);
    </script>
</body>
</html>
